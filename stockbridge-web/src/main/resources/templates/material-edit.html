<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit material | StockBridge 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: sidebar}"></div><div class="workspace"><div th:replace="~{fragments :: topbar}"></div><main class="main"><div class="pagehead"><div><div class="eyebrow">CATALOG MANAGEMENT</div><h1>Edit material</h1><p>Update the catalog record.</p></div></div><div class="panel" style="max-width:680px"><div th:if="${error}" th:text="${error}" class="alert alert-danger"></div><form th:action="@{/admin/materials/{id}/edit(id=${editId})}" th:object="${material}" method="post"><label class="form-label">Material name</label><input class="form-control mb-2" th:field="*{name}" required><div class="text-danger small mb-3" th:errors="*{name}"></div><label class="form-label">Category</label><select class="form-select mb-3" th:field="*{category}" required><option value="">Choose category</option><option value="FERROUS">Ferrous</option><option value="NON_FERROUS">Non-ferrous</option></select><label class="form-label">Reference price (CAD/kg)</label><input class="form-control mb-2" type="number" min="0" step="0.01" th:field="*{basePricePerKg}" required><div class="text-danger small mb-3" th:errors="*{basePricePerKg}"></div><button class="btn btn-primary">Save changes</button><a class="btn btn-outline-secondary ms-2" th:href="@{/admin}">Cancel</a></form></div></main></div></body></html>
