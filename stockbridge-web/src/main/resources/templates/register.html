<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | StockBridge 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="auth-card"><div class="eyebrow mb-2">JOIN THE PLATFORM</div><h2>Create your account</h2><p class="muted">New accounts start with Staff permissions.</p><div th:if="${error}" th:text="${error}" class="alert alert-danger"></div><form th:action="@{/register}" method="post"><label class="form-label">Full name</label><input name="fullName" class="form-control mb-3" required minlength="2"><label class="form-label">Work email</label><input type="email" name="email" class="form-control mb-3" required><label class="form-label">Password (8+ characters)</label><input type="password" name="password" class="form-control mb-4" required minlength="8"><button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 small"><a th:href="@{/login}">Back to sign in</a></p></div></body></html>
