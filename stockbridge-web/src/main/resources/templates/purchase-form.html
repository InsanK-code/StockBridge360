<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Record purchase | StockBridge 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: sidebar}"></div><div class="workspace"><div th:replace="~{fragments :: topbar}"></div><main class="main"><div class="pagehead"><div><div class="eyebrow">INBOUND TRANSACTIONS</div><h1>Record purchase</h1><p>Receive material into a warehouse with validated weight and cost.</p></div></div><div class="panel" style="max-width:760px"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/purchases/new}" method="post"><label class="form-label">Supplier</label><select class="form-select mb-3" name="supplierId" required><option value="">Select supplier</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.businessName}"></option></select><label class="form-label">Material</label><select class="form-select mb-3" name="materialId" required><option value="">Select material</option><option th:each="m:${materials}" th:value="${m.id}" th:text="${m.name}"></option></select><label class="form-label">Warehouse</label><select class="form-select mb-3" name="warehouseId" required><option value="">Select warehouse</option><option th:each="w:${warehouses}" th:value="${w.id}" th:text="${w.name}"></option></select><div class="row"><div class="col-md-6"><label class="form-label">Weight (kg)</label><input class="form-control mb-3" name="weightKg" type="number" step="0.01" min="0.01" required></div><div class="col-md-6"><label class="form-label">Rate (CAD/kg)</label><input class="form-control mb-3" name="pricePerKg" type="number" step="0.01" min="0" required></div></div><button class="btn btn-primary mt-2">Validate & post purchase</button></form></div></main></div></body></html>
