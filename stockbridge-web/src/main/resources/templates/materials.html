<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materials | StockBridge 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: sidebar}"></div><div class="workspace"><div th:replace="~{fragments :: topbar}"></div><main class="main"><div class="pagehead"><div><div class="eyebrow">CATALOG MANAGEMENT</div><h1>Material catalog</h1><p>Explore and filter your materials and reference prices.</p></div><a sec:authorize="hasAnyRole('ADMIN','MANAGER')" class="btn btn-primary" th:href="@{/materials/new}">+ Add material</a></div><div class="panel"><form method="get" th:action="@{/materials}" class="row g-3 mb-4"><div class="col-md-5"><input class="form-control" name="q" placeholder="Search material name..." th:value="${q}"></div><div class="col-md-3"><select name="category" class="form-select"><option value="">All categories</option><option value="FERROUS" th:selected="${category != null and category.name() == 'FERROUS'}">Ferrous</option><option value="NON_FERROUS" th:selected="${category != null and category.name() == 'NON_FERROUS'}">Non-ferrous</option></select></div><div class="col-md-3"><select name="sort" class="form-select"><option value="name">Name</option><option value="basePricePerKg" th:selected="${sort == 'basePricePerKg'}">Price</option><option value="createdAt" th:selected="${sort == 'createdAt'}">Date added</option></select></div><div class="col-md-1"><button class="btn btn-primary w-100">Go</button></div></form><div class="table-responsive"><table class="table"><thead><tr><th>Material</th><th>Category</th><th>Price / kg</th><th>Created</th></tr></thead><tbody><tr th:each="m:${results.content}"><td class="fw-bold" th:text="${m.name}"></td><td><span class="tag" th:text="${m.category}"></span></td><td th:text="'CAD $'+${m.basePricePerKg}"></td><td th:text="${#temporals.format(m.createdAt,'MMM dd, yyyy')}"></td></tr><tr th:if="${results.empty}"><td colspan="4" class="empty">No materials match these filters.</td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center mt-3"><span class="muted small" th:text="${results.totalElements}+' records'">0 records</span><div><a class="btn btn-sm btn-outline-secondary" th:if="${results.hasPrevious()}" th:href="@{/materials(page=${results.number-1},q=${q},category=${category},sort=${sort})}">Previous</a><a class="btn btn-sm btn-outline-secondary" th:if="${results.hasNext()}" th:href="@{/materials(page=${results.number+1},q=${q},category=${category},sort=${sort})}">Next</a></div></div></div></main></div></body></html>
