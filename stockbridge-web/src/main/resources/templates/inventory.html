<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory | StockBridge 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: sidebar}"></div><div class="workspace"><div th:replace="~{fragments :: topbar}"></div><main class="main"><div class="pagehead"><div><div class="eyebrow">WAREHOUSE VISIBILITY</div><h1>Stock inventory</h1><p>Live stock lots by material, supplier and yard.</p></div><a class="btn btn-primary" th:href="@{/purchases/new}">+ Receive stock</a></div><div class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Lot ID</th><th>Material</th><th>Warehouse</th><th>Supplier</th><th>Available weight</th><th>Est. value</th></tr></thead><tbody><tr th:each="lot:${lots}"><td th:text="'#'+${lot.id}"></td><td class="fw-bold" th:text="${lot.material.name}"></td><td th:text="${lot.warehouse.name}"></td><td th:text="${lot.sourceSupplier != null ? lot.sourceSupplier.businessName : '—'}"></td><td><span class="tag" th:text="${lot.weightKg}+' kg'"></span></td><td th:text="'CAD $'+${lot.weightKg.multiply(lot.material.basePricePerKg)}"></td></tr></tbody></table></div></div></main></div></body></html>
