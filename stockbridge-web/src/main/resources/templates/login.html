<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | StockBridge 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="auth-card"><div class="eyebrow mb-2">STOCKBRIDGE 360</div><h2>Welcome back.</h2><p class="muted mb-4">Sign in to your operations workspace.</p><div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div><div th:if="${param.logout}" class="alert alert-success">Signed out successfully.</div><div th:if="${param.registered}" class="alert alert-success">Account created. You can now sign in.</div><form th:action="@{/login}" method="post"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="username" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Sign in securely</button></form><p class="mt-4 mb-0 small">New here? <a th:href="@{/register}">Create an account</a> · <a th:href="@{/}">Home</a></p></div></body></html>
