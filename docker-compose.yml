services:
  postgres:
    image: postgres:16-alpine
    container_name: stockbridge-postgres
    environment:
      POSTGRES_DB: stockbridge_alerts
      POSTGRES_USER: stockbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockbridge_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - stockbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbridge -d stockbridge_alerts"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stockbridge_pgdata:
